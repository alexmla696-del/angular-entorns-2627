<!-- Perfil -->
<div class="perfil">
  <!-- Nom i cognom en majúscules, dins la mateixa interpolació -->
  <h2>{{ (nom + ' ' + cognom).toUpperCase() }}</h2>

  <!-- Propietats -->
  <p>Nom: {{ nom }}</p>
  <p>Cognom: {{ cognom }}</p>
  <p>Edat: {{ edat }}</p>
  <p>Cicle: {{ cicle }}</p>

  <!-- Operador ternari -->
  <p>Major d'edat: {{ edat >= 18 ? 'Sí' : 'No' }}</p>

  <!-- Any de naixement -->
  <p>Any de naixement: {{ 2026 - edat }}</p>

  <!-- Getters -->
  <p>Nom complet: {{ nomComplet }}</p>
  <p>Inicials: {{ inicials }}</p>
  <p>Generació: {{ generacio }}</p>
</div>
